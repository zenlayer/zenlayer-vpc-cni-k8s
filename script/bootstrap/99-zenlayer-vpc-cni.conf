# Installed on the host by zenlayer-vpc-cni (script/bootstrap/install_env.sh).
#
# Pod traffic enters the host through a per-pod veth named eni<hash>, and the
# reverse path for a pod address resolves through the CNI's own ip rules rather
# than the plain main table. Reverse-path filtering on those interfaces has to
# be off for that to be reliable.
#
# The CNI writes rp_filter itself when it creates each veth, but it cannot keep
# it: systemd-sysctl replays the host's sysctl.d onto every interface as it
# appears, and the stock Ubuntu policy (/usr/lib/sysctl.d/50-default.conf and
# 55-network-security.conf) sets rp_filter=2 for net.ipv4.conf.*. Whether that
# replay lands before or after the CNI's write is a race, so a freshly created
# veth can sit with the host's value for as long as no other pod is created.
#
# Being the highest-numbered file makes this the last word, so the udev replay
# itself now applies 0 and the race disappears.
#
# The glob is deliberately narrow. The host's rp_filter=2 is a security
# baseline, and it stays in force for every interface that is not one of this
# CNI's pod veths -- including eth*, the ENIs themselves, and the defaults.
net.ipv4.conf.eni*.rp_filter = 0
