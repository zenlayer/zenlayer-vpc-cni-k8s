# Behavior switches have no default and must be passed on install and on every
# upgrade, so a default changing in a later chart cannot flip one on an existing
# cluster: zec.ipamType, zec.ipStack, zec.manageUntaggedENI (with ipamType direct
# or an in-cluster controlplane),
# cni.mode, cilium.enabled and networkPolicy.enabled. `helm upgrade
# --reset-then-reuse-values` (Helm 3.14+) carries the previous values forward
# onto this chart's defaults; plain --reuse-values also keeps the previous
# chart's defaults, so keys added since then go missing.
#
# A NEW plain IPv4 install with an in-cluster controlplane (the centralized
# deployment the README describes; for direct mode see docs/deploy-direct.md):
#
#   --set zec.ipamType=crd --set controlplane.deployment.enabled=true \
#   --set zec.ipStack=ipv4 --set zec.manageUntaggedENI=false \
#   --set cni.mode=chained --set cilium.enabled=false \
#   --set networkPolicy.enabled=false
#
# Do not use that block to UPGRADE a 1.0.0 release: 1.0.0 set these switches
# through its own defaults, which neither reuse flag carries forward, and they
# were ipamType direct (implied), ipStack ipv4, manageUntaggedENI true,
# cni.mode chained, cilium.enabled false and networkPolicy.enabled false. Pass
# the values the release actually ran with (`helm get values --all`); see
# docs/deploy-direct.md, "Upgrading from 1.x".
#
image:
  repository: "docker.io/zenlayer1/zeccni"
  tag: "v2.0.0"
  pullPolicy: "IfNotPresent"

zec:
  # Who talks to the Zenlayer OpenAPI.
  #   direct: every node's daemon, with the zec.secretName Secret mounted on
  #           every node.
  #   crd:    only the controlplane (see controlplane below). Nodes hold no
  #           credentials; each states what it needs in its ZecNode object.
  #           vpcID, subnetIDs, securityGroupID, manageUntaggedENI and the IPv6
  #           billing then configure the in-cluster controlplane, not the node
  #           (a platform-run controlplane, controlplane.platformUser, has its
  #           own configuration and the chart renders none of them); pool sizing
  #           is controlplane.scaler, and zec.poolTarget* are unused. The
  #           per-node vpc-cni-config label may carry none of them. Needs
  #           Kubernetes 1.30+, and the ZecNode CRD in chart/crds, which helm
  #           installs only on first install -- apply it by hand on upgrade.
  #
  # REQUIRED, no default -- see the top of this file.
  # ipamType: "direct"
  # Zenlayer VPC ID. All subnets below must belong to this VPC.
  vpcID: ""
  # IDs of the subnets Pod addresses come from, and only from. Interfaces the
  # plugin creates go in them. The node's own primary interface serves pods
  # too when its subnet is one of these; otherwise it serves none, and a node
  # holds that interface's share fewer pods.
  # At most 5 subnets, all in the same VPC.
  subnetIDs: []
  # ID of the security group applied to ENIs created by the daemon.
  securityGroupID: ""
  # IP family: "ipv4" or "dual". IPv6-only is rejected at install by the values
  # schema (and by the daemon); see the schema for what is unfinished.
  #
  # REQUIRED, no default -- see the top of this file.
  # ipStack: "ipv4"
  # Public IPv6 billing, used only when ipStack is "dual".
  #
  # The platform refuses to enable IPv6 on an interface without these when the
  # subnet's ipv6Type is Public, which every dual-stack subnet seen so far is.
  # The daemon enables IPv6 on each interface it creates, so it is the daemon
  # that has to supply them -- which means these settings decide what the
  # cluster is billed for. Ignored on a Private-IPv6 subnet.
  #
  # ByTrafficPackage bills actual use and needs ipv6PackageSize.
  # ByBandwidth bills the cap. BandwidthCluster joins ipv6ClusterId.
  ipv6InternetChargeType: "ByTrafficPackage"
  # Public IPv6 throughput cap in Mbps, applied per network interface -- not per
  # pod. Every pod whose address sits on the same interface shares this cap, so
  # a busy pod can starve its neighbours on that interface while pods on the
  # node's other interfaces are unaffected.
  ipv6Bandwidth: 10000
  # Traffic package size in TB, and a multiple of 0.1.
  #
  # The 0 below is not a usable value, it is the absence of one. Under
  # ByTrafficPackage -- the default charge type above -- the daemon refuses to
  # start until you set a positive size, because a traffic commitment has no safe
  # default. Under the other charge types this field is ignored, and 0 is then
  # simply never read.
  #
  # If your account is on an hourly billing period the platform rejects
  # committed package sizes outright; use ipv6InternetChargeType: ByBandwidth
  # there instead.
  ipv6PackageSize: 0
  # Shared bandwidth package to join, required when ipv6InternetChargeType is
  # BandwidthCluster.
  ipv6ClusterId: ""
  # Network mode. Only "eni_multi_ip" (ENI multi-IP) is supported.
  networkMode: "eni_multi_ip"
  # Pod datapath, rendered into the conflist as eniip_virtual_type. "veth" is
  # the only accepted value: a veth pair plus per-ENI policy routing (one route
  # table per ENI, 1000+ifindex). Pods reach the host stack directly, so
  # kube-proxy sees both directions of service traffic without help, and it is
  # the device model Cilium's generic-veth CNI chaining expects.
  #
  # Any other value is rejected at install time by this chart's values schema,
  # and again by the CNI plugin on every ADD, rather than being ignored.
  #
  # Note where the second check is: the daemon does not read this field at all.
  # Editing eniip_virtual_type in the ConfigMap directly, bypassing helm, leaves
  # the daemon starting normally with every probe green while each pod fails its
  # CNI ADD and stays in ContainerCreating.
  dataPath: "veth"
  # What to do with a secondary network interface that is attached to the node
  # but was not created by this plugin and carries no
  # "zenlayer:cni:no-manage" tag.
  #
  # false leaves such interfaces untouched. They then still consume the
  # instance's interface quota, which reduces how many pod addresses the node
  # can serve.
  #
  # true adopts it, but only if it sits in one of the subnetIDs above: its
  # secondary addresses join the pod address pool, the plugin DETACHES AND
  # DELETES it when the pool shrinks, and under ipStack "dual" it enables IPv6
  # on it -- a billable operation on a Public-IPv6 subnet.
  #
  # Tag any interface attached for another purpose -- storage, management,
  # monitoring -- with "zenlayer:cni:no-manage=true". The tag is honored
  # whatever this setting is.
  #
  # REQUIRED, no default -- see the top of this file.
  # manageUntaggedENI: false
  # Service CIDR(s), comma-separated.
  #
  # Leave it empty only on a kubeadm cluster. An empty value makes the daemon
  # read the service subnet from the kube-system/kubeadm-config ConfigMap, and
  # if that lookup fails the daemon exits with "error retrieving service cidr"
  # -- so on a cluster kubeadm did not build, this field is required, not
  # optional.
  #
  # Nothing in the datapath acts on the value itself: service traffic already
  # traverses the host stack, so there is no redirect to install. The daemon
  # still insists on having an IPv4 service CIDR from one of the two sources. On
  # a dual-stack cluster a missing IPv6 entry is only logged.
  serviceCidr: ""
  # Name of the Secret holding the Zenlayer OpenAPI static credentials.
  # Create it out of band -- it is deliberately not templated by this chart, so
  # the credentials never land in values.yaml, git, or the helm release:
  #   kubectl create secret -n kube-system generic zenlayer-cni-access-key \
  #     --from-literal=AccessKeyID='<access-key-id>' \
  #     --from-literal=AccessKeyPassword='<access-key-secret>'
  secretName: "zenlayer-cni-access-key"
  # Warm-pool sizing knobs.
  # poolTarget is how many idle addresses to keep ready; poolTargetMin is a
  # floor on the pool as a whole, in-use addresses included.
  #
  # poolTargetMax caps the pool as a whole, and with poolTargetCapProbe on --
  # the default -- it is ignored: the cap comes from the instance's real
  # capacity instead. It only takes effect when probing is turned off, and then
  # it becomes the capacity this node advertises to the scheduler. The value
  # below is what the smallest instance can hold: two interfaces of six
  # addresses each, less the primary address on each, is ten -- five when the
  # primary's subnet is not in subnetIDs, which then serves no pod; lower it
  # to match. Turning probing off on a larger instance without raising this
  # pins the node to ten pods.
  poolTarget: 2
  poolTargetMin: 1
  poolTargetMax: 10
  poolTargetCapProbe: true
  # Reconcile / pool-monitor intervals (seconds).
  reconcileIntervalSec: 1200
  poolMonitorIntervalSec: 120
  # Port the daemon serves /healthz and /metrics on. The pod runs
  # with hostNetwork, so this port is taken on the node itself.
  healthAndDebugPort: 11414
  # Log level. Empty keeps the built-in default (info).
  #
  # It drives both binaries, which need different mechanisms: zec-ipam reads
  # the ZENLAYER_CNI_LOGLEVEL env rendered onto the DaemonSet, while zec-cni is
  # exec'd by kubelet from the host and never sees the pod's env, so "debug"
  # additionally sets "debug": true in the conflist for it (inside the ipam
  # block when it runs as cilium's delegated IPAM).
  logLevel: ""
  # Kubernetes apiserver host/port the daemon and the controlplane connect to.
  #
  # Empty with cilium.enabled: read from kube-public/cluster-info (the address
  # nodes join with) at install / upgrade, as Cilium's k8sServiceHost=auto
  # does. Where Cilium replaces kube-proxy, the in-cluster Service is served
  # only once Cilium is up, and on a dual-stack node Cilium waits for the IPv6
  # this daemon's registration brings, so the daemon must not depend on it.
  # Empty without Cilium: the in-cluster Service.
  #
  # Set them explicitly on a cluster without that ConfigMap (not built with
  # kubeadm), or to pin another entry point. Use a load balancer or VIP, not
  # one master's address -- the auto-detected value is whatever cluster-info
  # holds, which may be one master's; the release notes print it. Set the port
  # with the host: a host alone keeps kubelet's injected port, 443.
  k8sServiceHost: ""
  k8sServicePort: ""

# Which plugin owns the pod's network device.
#
#   chained   -- this plugin creates the device (a veth pair) and wires the pod.
#                Cilium, if enabled, is chained after it for policy and
#                observability. This is the recommended mode.
#   delegated -- Cilium creates the device and this plugin only supplies
#                addresses and places the per-ENI host routing. Requires
#                cilium.enabled=true. See docs/deploy-cilium-netkit.md.
#
# The two are per-cluster, not per-node: a node reading one conflist while its
# neighbours read the other produces pods whose datapath depends on where they
# landed.
#
# REQUIRED, no default -- see the top of this file.
#   cni:
#     mode: chained
cni: {}

# Chain upstream Cilium after this plugin.
#
# This is the switch that actually changes the datapath wiring: the conflist
# gains a second plugin that hands the pod to cilium-cni once this plugin has
# wired it, which is upstream Cilium's generic-veth CNI chaining. The veth pair
# and the per-ENI policy routing are unchanged.
#
# It is deliberately separate from networkPolicy below. Policy is the common
# reason to want Cilium but not the only one -- Hubble observability needs the
# agent and no policy at all -- and folding the two together would make
# "observability without policy" unexpressible.
#
# Enabling this does NOT install Cilium. Cilium is deployed separately, from its
# own upstream chart, and must be running on the node before the conflist goes
# live -- the daemon blocks until the agent answers, because cilium-cni has no
# fallback path on ADD. Several of the Cilium values are required rather than
# recommended; see docs/deploy-cilium-chained.md (Chinese: docs/deploy-cilium-chained-cn.md).
cilium:
  # REQUIRED, no default -- see the top of this file.
  # enabled: false
  # How long the daemon waits for the cilium agent socket before giving up and
  # restarting. Empty keeps the built-in default (5m). Go duration syntax.
  waitTimeout: ""

# NetworkPolicy enforcement.
#
# This chart installs no policy engine of its own, and this switch renders
# nothing: it declares whether one is required. Without Cilium nothing enforces
# NetworkPolicy -- nothing rejects the objects either, so the only symptom is
# traffic that should have been blocked getting through. With cilium.enabled the
# Cilium agent enforces NetworkPolicy whatever this is set to (in Cilium's
# default policyEnforcementMode).
#
# Turning it on requires the engine: with provider "cilium", cilium.enabled must
# also be true, and the chart refuses to render otherwise rather than installing
# a conflist that silently enforces nothing.
networkPolicy:
  # REQUIRED, no default -- see the top of this file.
  # enabled: false
  # Engine expected to enforce policy. "cilium" is the only accepted value.
  provider: "cilium"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  # limits are accepted too and render straight onto the container. They are not
  # set by default: the daemon is on the path of every pod's CNI ADD, so a cpu
  # limit throttles pod startup across the node, and a memory limit turns a
  # transient spike into an OOMKill that takes IPAM down with it.
  # limits:
  #   cpu: 1
  #   memory: 512Mi

# The credential-holding half of zec.ipamType=crd. Ignored with ipamType direct.
controlplane:
  # The Kubernetes user a controlplane run by the platform, outside this
  # cluster, authenticates as. The chart grants it what it needs. Empty when
  # the controlplane runs in the cluster (deployment.enabled).
  platformUser: ""
  # Region of the pod subnets and of every node; interfaces and subnets are
  # looked up there, and a node whose instance is in another region of the
  # same VPC is refused (IdentityMismatch). Required with deployment.enabled.
  regionID: ""
  identity:
    # auto: when a Node has no spec.providerID, find its instance by the Node's
    # InternalIP, check it against what the node's daemon reads from DMI, and
    # write providerID (zenlayer:///<regionId>/<instanceId>, the form
    # zenlayer-cloud-controller-manager writes) -- once: the apiserver never
    # lets it change. manual: never write it; serve only Nodes whose
    # providerID is already set, in that form or the older zenlayer://<instanceId>.
    providerID: "auto"
  # Warm-pool sizing handed to every node through its ZecNode: how many idle
  # addresses each node keeps ready. A change takes effect without restarting
  # the daemons. There is no maximum here -- a node may hold as many addresses
  # as its capacity allows; zec.poolTarget* do not apply in crd mode.
  scaler:
    targetMin: 1
    target: 2
  # Per-node-group sizing; the first group whose selector matches a Node wins.
  #   - selector: {pool: large}
  #     scaler: {targetMin: 10, target: 20}
  nodeGroups: []
  # Run the controlplane in this cluster: for clusters not managed by the
  # platform. It mounts zec.secretName -- the only place the credentials are.
  # Host network and tolerating the taints of a node not yet Ready and of
  # control-plane nodes: the pod network is what it provides, so it cannot
  # wait for one. A cordoned node is not tolerated, so a drain moves it, and a
  # node that stops answering is left after 60 s, so even the single default
  # replica moves to a live node.
  deployment:
    enabled: false
    # Empty: the controlplane's own image, <image.repository>-controlplane
    # with image.tag. It runs as an unprivileged user and holds only the
    # controlplane, so the node image carries no credential-holding binary.
    image: ""
    # One leader does the work either way; a second replica takes over
    # sooner, and a rollout to a configuration that never gets ready stops
    # with it still working (with 1, the old pod is gone first). At most one
    # per node (the health port is a host port), so more than one needs that
    # many nodes matching where it may run.
    replicas: 1
    # How many nodes are reconciled at the same time.
    workers: 4
    # Where the controlplane may run, on top of linux/amd64. Empty: anywhere,
    # preferring nodes labelled node-role.kubernetes.io/control-plane, since
    # it mounts the credentials and a worker runs tenant workloads. A selector
    # set here is a requirement instead.
    nodeSelector: {}
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
