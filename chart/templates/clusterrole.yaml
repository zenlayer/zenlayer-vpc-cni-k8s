apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zenlayer-vpc-cni-plugin
rules:
  # GetLocalNode / NewK8sService read the node the daemon runs on.
  - apiGroups: [ "" ]
    resources: [ "nodes" ]
    verbs: [ "get", "list", "watch" ]
  # The cluster id (the kube-system namespace's uid) tagged on every interface
  # created, so a VPC shared by several clusters is swept per cluster.
  - apiGroups: [ "" ]
    resources: [ "namespaces" ]
    resourceNames: [ "kube-system" ]
    verbs: [ "get" ]
  # Pod informer (field-selected to this node), ListLocalPods, GetPod, and the
  # annotation patch in PatchPodAnnotation.
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "list", "watch", "patch" ]
  # EvictPod (policy/v1 Eviction) when a node runs out of ENI-IP capacity.
  - apiGroups: [ "" ]
    resources: [ "pods/eviction" ]
    verbs: [ "create" ]
  # eni_conf is read from the zenlayer-cni-config ConfigMap; serviceCidr falls
  # back to kube-system/kubeadm-config. A ConfigMap informer watches for changes.
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    verbs: [ "get", "list", "watch" ]
  # Node and pod events recorded through the EventBroadcaster sink.
  - apiGroups: [ "" ]
    resources: [ "events" ]
    verbs: [ "create", "patch", "update" ]
  {{- if eq .Values.zec.ipamType "crd" }}
  # ipamType crd: the daemon writes the spec of its own ZecNode -- never
  # status, never create or delete. The admission policy in controlplane.yaml
  # keeps each node to the ZecNode named after it.
  - apiGroups: [ "network.zenlayer.com" ]
    resources: [ "zecnodes" ]
    verbs: [ "get", "list", "watch", "patch" ]
  {{- end }}
